<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RR Crypto Earning</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js" data-zone="12281843" data-sdk="show_12281843"></script>
<style>
:root{--bg:#0b1220;--card:#121c33;--line:#22304f;--txt:#e8eefc;--mut:#8fa0c4;--gold:#f5c04a;--green:#34d399;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.bal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;text-align:right}
.bal b{color:var(--gold);font-size:18px}.bal small{display:block;color:var(--mut)}
main{padding:0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tile{cursor:pointer}.tile .ic{font-size:30px}.tile b{display:block;margin-top:6px}.tile small{color:var(--mut)}
h2{font-size:17px;margin:6px 0 12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--gold);color:#1b1b1b;font-weight:700;width:100%}
button.sec{background:#1d2b4a;color:var(--txt)}button:disabled{opacity:.5}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e1730;color:var(--txt);font:inherit;margin:6px 0}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--green)}.bad{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1730;border-top:1px solid var(--line);padding:6px}
nav div{flex:1;text-align:center;font-size:11px;color:var(--mut);padding:6px 0;border-radius:10px}
nav div span{display:block;font-size:20px}nav .on{color:var(--gold);background:#1a2745}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts button{background:#1d2b4a;color:var(--txt);font-size:20px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem div{aspect-ratio:1;border-radius:12px;background:#1d2b4a;display:flex;align-items:center;justify-content:center;font-size:26px}
.mem .f{background:#2b3f6b}.mem .m{background:#14532d}
.bar{height:8px;background:#0e1730;border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;max-width:88%;display:none;z-index:9;text-align:center}
.center{text-align:center;padding:40px 16px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"><div class="center">Loading…</div></div>

<script>
/* ====== Put your Apps Script Web App (/exec) URL here ====== */
const API = 'https://script.google.com/macros/s/AKfycbwmvQklBwd7YwjqvP0vCxRcNXS0TKDIgUF6TVpO6TWuD3dnFkz8IUuWL2ARzWrCPNrm/exec';
/* ================================================================ */
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let bt = '';
try { bt = localStorage.getItem('rr_bt') || ''; if (!bt) { bt = (crypto.randomUUID()+crypto.randomUUID()).replace(/-/g,''); localStorage.setItem('rr_bt', bt); } } catch(e){ bt = 'x'.repeat(32); }

async function call(action, payload = {}) {
  payload.browserToken = bt;
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, initData: (tg && tg.initData) || '', payload })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j.data;
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, view = 'home', busy = false, tick = null;

function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3200); }
async function run(fn) { if (busy) return; busy = true; try { return await fn(); } catch (e) { toast(e.message); } finally { busy = false; } }
function setState(s) { S = s; S._at = Date.now(); render(); }

async function boot() {
  if (!API || API.startsWith('PASTE')) { $('app').innerHTML = '<div class="center">Set the API URL in index.html.</div>'; return; }
  try {
    const v = await call('verifyChannels');
    if (!v.joined) return gate(v);
    setState(await call('init'));
  } catch (e) { $('app').innerHTML = '<div class="center bad">' + esc(e.message) + '<br><br><button onclick="boot()">Retry</button></div>'; }
}
function gate(v) {
  $('app').innerHTML = '<main style="padding-top:30px"><div class="card"><h2>Join required channels</h2>' +
    v.channels.map((c, i) => '<div class="row"><span>' + esc(c.name) + ' ' + (c.joined ? '<span class="ok">✔</span>' : '') + '</span>' +
      (c.joined ? '' : '<button class="sec" style="width:auto" onclick="openLink(\'' + esc(c.url) + '\')">Join</button>') + '</div>').join('') +
    '<br><button onclick="boot()">I joined — Continue</button></div></main>';
}
function openLink(u) { if (tg && u.startsWith('https://t.me/')) tg.openTelegramLink(u); else window.open(u, '_blank'); }

/* ---------- Rendering ---------- */
const NAV = [['home','🏠','Home'],['learn','📚','Learn'],['games','🎮','Games'],['ranks','🏆','Ranks'],['invite','👥','Invite'],['profile','👤','Profile']];
const PARENT = { quiz: 'learn', tasks: 'home' };
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  if (!S) return;
  const on = PARENT[view] || view;
  const body = ({ home, learn, quiz, games, ranks, tasks, invite, profile })[view]();
  $('app').innerHTML =
    '<header><h1>' + esc(S.appName) + '</h1><div class="bal"><b>' + S.coins.toLocaleString() + ' 🪙</b><small>$' + S.usd + '</small></div></header>' +
    '<main>' + body + '</main><nav>' + NAV.map(n => '<div class="' + (n[0] === on ? 'on' : '') + '" onclick="go(\'' + n[0] + '\')"><span>' + n[1] + '</span>' + n[2] + '</div>').join('') + '</nav>';
  startTick();
}

function adCard(place, label, used) {
  return '<div class="card"><b>▶ ' + label + '</b><div class="mut">Earn ' + S.cfg.adReward + ' Coins per completed ad • 10 ads per day</div>' +
    '<div class="mut">' + used + '/10 ads today</div><br><button onclick="watchAd(\'' + place + '\')">Watch Ad</button>' +
    '<div class="mut" style="margin-top:8px">Coins are added right after the ad finishes.</div></div>';
}
function home() {
  const t = (v, ic, a, b) => '<div class="card tile" onclick="go(\'' + v + '\')"><div class="ic">' + ic + '</div><b>' + a + '</b><small>' + b + '</small></div>';
  return '<div class="grid">' + t('learn','📚','Crypto Learning','Learn in English') + t('games','🎮','Mini Games','Play & earn coins') +
    t('quiz','🧠','Daily Quiz','Test your knowledge') + t('ranks','🏆','Leaderboard','Top players & winner prize') +
    t('tasks','✅','Tasks','Complete channel tasks') + t('invite','👥','Invite Friends','Grow your community') + '</div>' +
    adCard('home_monetag', 'Watch Ads', S.ads.homeMonetag) + collectCard();
}
function collectCard() {
  const c = S.collecting; let inner;
  if (!c.startedAt) inner = '<button onclick="startCollect()">Start Collecting</button>';
  else if (c.ready || remaining() <= 0) inner = '<button onclick="claimCollect()">Claim ' + S.cfg.collectReward + ' Coins</button>';
  else inner = '<div class="center" style="padding:10px"><b id="cd" style="font-size:26px"></b><div class="mut">Collecting…</div></div>';
  return '<div class="card"><div class="mut" style="text-align:center">DAILY REWARD</div><h2 style="text-align:center">⏳ Daily Collecting</h2>' +
    '<div class="mut" style="text-align:center;margin-bottom:10px">' + S.cfg.collectHours + ' hours → ' + S.cfg.collectReward + ' Coins</div>' + inner + '</div>';
}
function remaining() { return S.collecting.remainingMs - (Date.now() - S._at); }
function startTick() {
  clearInterval(tick);
  const el = $('cd'); if (!el) return;
  const f = () => { const r = remaining(); if (r <= 0) { clearInterval(tick); render(); return; }
    const h = Math.floor(r / 3600000), m = Math.floor(r % 3600000 / 60000), s = Math.floor(r % 60000 / 1000);
    el.textContent = [h, m, s].map(x => String(x).padStart(2, '0')).join(':'); };
  f(); tick = setInterval(f, 1000);
}
const startCollect = () => run(async () => { setState(await call('startCollecting')); });
const claimCollect = () => run(async () => { setState(await call('claimCollecting')); toast('Coins added!'); });
 function learn() {
  return '<h2>📚 Crypto Learning</h2>' + S.lessons.map(l => {
    const d = S.completedLessons.includes(l.id);
    return '<div class="card"><b>' + esc(l.title) + (d ? ' <span class="ok">✔</span>' : '') + '</b><div class="mut">' + esc(l.desc) + '</div><p>' + esc(l.body) + '</p>' +
      (d ? '' : '<button class="sec" onclick="doneLesson(\'' + l.id + '\')">Mark complete</button>') + '</div>';
  }).join('') + '<button onclick="go(\'quiz\')">🧠 Daily Quiz</button>';
}
const doneLesson = id => run(async () => { setState(await call('completeLesson', { lessonId: id })); });

let qa = [];
function quiz() {
  if (S.quizDone) return '<h2>🧠 Daily Quiz</h2><div class="card">Today\'s quiz is already submitted. Come back tomorrow!</div>';
  return '<h2>🧠 Daily Quiz</h2>' + S.quiz.map((q, i) => '<div class="card"><b>' + (i + 1) + '. ' + esc(q.q) + '</b>' +
    q.a.map((a, j) => '<label class="row"><span>' + esc(a) + '</span><input type="radio" name="q' + i + '" value="' + j + '" style="width:auto" onchange="qa[' + i + ']=' + j + '"></label>').join('') + '</div>').join('') +
    '<button onclick="sendQuiz()">Submit</button>';
}
const sendQuiz = () => run(async () => {
  if (qa.filter(x => x !== undefined).length < S.quiz.length) throw new Error('Answer all questions.');
  const r = await call('submitQuiz', { answers: qa }); qa = []; toast('Score ' + r.score + '/' + r.total + ' • +' + r.score + ' coins'); setState(r.state);
});

function tasks() {
  return '<h2>✅ Channel Tasks</h2>' + S.channels.map(c => '<div class="card"><b>' + esc(c.name) + '</b> <span class="mut">+' + c.reward + ' coins</span><br><br>' +
    (c.done ? '<span class="ok">Completed ✔</span>' : '<div class="grid"><button class="sec" onclick="openLink(\'' + esc(c.url) + '\')">Open</button><button onclick="claimTask(' + c.index + ')">Claim</button></div>') + '</div>').join('') +
    adCard('task_monetag', 'Task Ad (Monetag)', S.ads.taskMonetag) + adCard('task_adsun', 'Task Ad (Adsun)', S.ads.taskAdsun);
}
const claimTask = i => run(async () => { setState(await call('claimTask', { index: i })); toast('Task reward added'); });

/* ---------- Ads ---------- */
async function watchAd(place) {
  await run(async () => {
    if (place === 'task_adsun') {
      // TODO: add the Adsun SDK here -> window.showAdsunAd = () => <Adsun show call>
      if (typeof window.showAdsunAd !== 'function') throw new Error('Adsun ad SDK is not added yet.');
    } else if (typeof window.show_12281843 !== 'function') throw new Error('Monetag SDK did not load.');
    const r = await call('startAd', { placement: place });
    if (place === 'task_adsun') await window.showAdsunAd(r.ymid);
    else await window.show_12281843({ ymid: r.ymid });
    setState(await call('claimAd', { ymid: r.ymid }));
    toast('+' + S.cfg.adReward + ' coins added!');
  });
}

/* ---------- Games ---------- */
let ch = null, mm = null;
function games() {
  return '<h2>🎮 Mini Games</h2>' +
    '<div class="card"><b>🪙 Find Correct Coin</b> <span class="mut">+10</span><div id="coinBox" style="margin-top:8px"><button onclick="newChallenge(\'coin\')">Play</button></div></div>' +
    '<div class="card"><b>➕ Math Challenge</b> <span class="mut">+10</span><div id="mathBox" style="margin-top:8px"><button onclick="newChallenge(\'math\')">Play</button></div></div>' +
    '<div class="card"><b>🧩 Memory Match</b> <span class="mut">+5 (once daily)</span><div id="memBox" style="margin-top:8px"><button onclick="startMem()">Play</button></div></div>';
}
const newChallenge = kind => run(async () => {
  ch = await call(kind === 'coin' ? 'newCoinChallenge' : 'newMathChallenge');
  const box = $(kind === 'coin' ? 'coinBox' : 'mathBox');
  box.innerHTML = '<div style="font-size:20px;text-align:center">' + (kind === 'coin' ? esc(ch.prompt) + ': <b>' + esc(ch.target) + '</b>' : esc(ch.question)) + '</div>' +
    '<div class="opts">' + ch.options.map((o, i) => '<button onclick="answer(\'' + kind + '\',' + i + ')">' + esc(o) + '</button>').join('') + '</div>';
});
const answer = (kind, i) => run(async () => {
  const r = await call(kind === 'coin' ? 'submitCoinChallenge' : 'submitMathChallenge', { challengeId: ch.challengeId, answer: i });
  toast(r.correct ? 'Correct! +' + r.score : 'Wrong answer'); setState(r.state);
});
function startMem() {
  const e = ['₿','Ξ','◎','Ł','Ð','◆'], c = [...e, ...e].sort(() => Math.random() - .5);
  mm = { c, open: [], done: [], lock: false }; drawMem();
}
function drawMem() {
  $('memBox').innerHTML = '<div class="mem">' + mm.c.map((x, i) => {
    const show = mm.open.includes(i) || mm.done.includes(i);
    return '<div class="' + (mm.done.includes(i) ? 'm' : show ? 'f' : '') + '" onclick="flip(' + i + ')">' + (show ? x : '?') + '</div>'; }).join('') + '</div>';
}
function flip(i) {
  if (mm.lock || mm.open.includes(i) || mm.done.includes(i)) return;
  mm.open.push(i); drawMem();
  if (mm.open.length < 2) return;
  const [a, b] = mm.open;
  if (mm.c[a] === mm.c[b]) { mm.done.push(a, b); mm.open = []; drawMem(); if (mm.done.length === mm.c.length) winMem(); }
  else { mm.lock = true; setTimeout(() => { mm.open = []; mm.lock = false; drawMem(); }, 800); }
}
const winMem = () => run(async () => { setState(await call('recordMiniGame', { game: 'Memory Match' })); toast('Memory Match +5 coins'); });

/* ---------- Ranks / Invite / Profile ---------- */
function ranks() {
  return '<h2>🏆 Leaderboard</h2><div class="card">' + (S.leaderboard.map((p, i) => '<div class="row"><span>' + (i + 1) + '. ' + esc(p.name) + '</span><b>' + p.score + '</b></div>').join('') || '<span class="mut">No scores yet</span>') + '</div>' +
    '<h2>🎁 Winner Prizes</h2><div class="card">' + (S.prizes.map(p => '<div class="row"><span>' + esc(p.winner) + '<div class="mut">' + esc(p.note) + ' • ' + esc(p.time) + '</div></span><b>' + p.coins + '</b></div>').join('') || '<span class="mut">No prizes yet</span>') + '</div>' +
    '<h2>💸 Payment Proofs</h2><div class="card">' + (S.paymentProofs.map(p => '<div class="row"><span>' + esc(p.name) + '<div class="mut">' + esc(p.method) + ' • ' + esc(p.time) + '</div></span><b class="ok">$' + p.usd + '</b></div>').join('') || '<span class="mut">No payments yet</span>') + '</div>';
}
function invite() {
  return '<h2>👥 Invite Friends</h2><div class="card"><div class="mut">Earn ' + S.cfg.refReward + ' coins when a friend watches 10 valid ads.</div>' +
    '<input id="rl" readonly value="' + esc(S.refLink) + '"><div class="grid"><button class="sec" onclick="copyLink()">Copy</button><button onclick="shareLink()">Share</button></div></div>' +
    '<div class="card"><b>' + S.referrals + '</b> friends • <b>' + S.referralCoins + '</b> coins earned</div>' +
    S.friends.map(f => '<div class="card"><div class="row"><span>' + esc(f.name) + '<div class="mut">' + f.adsWatched + '/10 ads</div></span>' +
      (f.claimed ? '<span class="ok">Claimed ✔</span>' : f.eligible ? '<button style="width:auto" onclick="claimRef(\'' + esc(f.id) + '\')">Claim</button>' : '<span class="mut">Pending</span>') + '</div></div>').join('');
}
const copyLink = () => { navigator.clipboard?.writeText(S.refLink).then(() => toast('Link copied')).catch(() => { $('rl').select(); document.execCommand('copy'); toast('Link copied'); }); };
const shareLink = () => { const u = 'https://t.me/share/url?url=' + encodeURIComponent(S.refLink) + '&text=' + encodeURIComponent('Earn coins with me!'); openLink(u.replace('https://t.me/share', 'https://t.me/share')); };
const claimRef = id => run(async () => { setState(await call('claimReferral', { friendId: id })); toast('Referral reward added'); });

function profile() {
  return '<h2>👤 ' + esc(S.name) + '</h2><div class="card"><div class="row"><span>ID</span><b>' + esc(S.id) + '</b></div><div class="row"><span>Tasks done</span><b>' + S.tasksDone + '</b></div>' +
    '<div class="row"><span>Coins</span><b>' + S.coins + '</b></div></div>' +
    '<div class="card"><b>💸 Withdraw</b><div class="mut">Minimum ' + S.cfg.min + ' coins ($' + (S.cfg.min * S.cfg.rate).toFixed(2) + ')</div>' +
    '<select id="wm"><option>USDT</option><option>TON</option></select><input id="wa" placeholder="Wallet address"><input id="wc" type="number" placeholder="Coins" min="' + S.cfg.min + '">' +
    '<button onclick="withdraw()">Request Withdrawal</button></div>' +
    '<div class="card"><b>History</b>' + (S.history.map(h => '<div class="row"><span>' + esc(h.method) + ' • ' + h.coins + '<div class="mut">' + esc(h.time) + '</div></span><b class="' + (String(h.status).toLowerCase() === 'paid' ? 'ok' : '') + '">' + esc(h.status) + '</b></div>').join('') || '<div class="mut">No withdrawals yet</div>') + '</div>' +
    (S.isAdmin ? '<div class="card"><b>🛠 Admin: Award prize</b><input id="pw" placeholder="Winner user ID"><input id="pc" type="number" placeholder="Coins"><input id="pn" placeholder="Note"><button onclick="award()">Award</button></div>' : '');
}
const withdraw = () => run(async () => {
  setState(await call('withdraw', { method: $('wm').value, address: $('wa').value, coins: $('wc').value })); toast('Withdrawal requested');
});
const award = () => run(async () => { setState(await call('adminAwardPrize', { winnerId: $('pw').value, coins: $('pc').value, note: $('pn').value })); toast('Prize awarded'); });

boot();
</script>
</body>
</html>
